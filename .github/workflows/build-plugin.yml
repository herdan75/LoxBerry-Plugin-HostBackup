name: Build plugin ZIP

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
  release:
    types:
      - published
      - prereleased

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y zip libcgi-pm-perl php-cli python3 rsync acl attr sudo shellcheck

      - name: Run automated tests
        run: bash tests/run.sh

      - name: Validate privileged entry points
        run: |
          shellcheck --severity=warning bin/*.sh preroot.sh postinstall.sh postroot.sh uninstall/uninstall.sh package.sh tests/run.sh
          sudo visudo -cf sudoers/sudoers
          php -l bin/notify-hostbackup.php

      - name: Build plugin ZIP
        run: bash ./package.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoxBerryHostBackup
          path: LoxBerryHostBackup_*.zip

  release:
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download validated plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: LoxBerryHostBackup
          path: dist

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LoxBerryHostBackup_*.zip
