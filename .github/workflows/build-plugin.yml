name: Build plugin ZIP

on:
  push:
    branches:
      - main
      - develop
      - 'codex/release-*'
    tags:
      - 'v*'
  pull_request:
  release:
    types:
      - published
      - prereleased

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y zip libcgi-pm-perl php-cli python3 rsync acl attr libcap2-bin sudo shellcheck samba cifs-utils

      - name: Run automated tests
        env:
          HOSTBACKUP_REQUIRE_LINUX_INTEGRATION: '1'
        run: bash tests/run.sh

      - name: Test real CIFS metadata compatibility and portable archive
        run: sudo env HOSTBACKUP_RUN_CIFS_INTEGRATION=1 bash tests/run-cifs.sh

      - name: Set up Node for mandatory browser regressions
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json

      - name: Install locked browser test dependencies
        working-directory: tests/browser
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Test rendered CGI in a real browser
        working-directory: tests/browser
        run: npm test

      - name: Validate privileged entry points
        run: |
          shellcheck --severity=warning bin/*.sh preroot.sh postinstall.sh postroot.sh uninstall/uninstall.sh package.sh tests/run.sh tests/run-cifs.sh
          sudo visudo -cf sudoers/sudoers
          php -l bin/notify-hostbackup.php

      - name: Build plugin ZIP
        run: bash ./package.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoxBerryHostBackup
          path: LoxBerryHostBackup_*.zip

  release:
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download validated plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: LoxBerryHostBackup
          path: dist

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LoxBerryHostBackup_*.zip
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
